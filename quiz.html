<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Подбор книги — Всем миром</title>
<meta name="description" content="Шесть вопросов: повод, дата, доставка, сколько фото, кто пишет тексты, кто участвует — и формат книги с ценой.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,500;0,700;0,800;1,500&family=Onest:wght@400;500;600;700&family=Caveat:wght@500;700&display=swap">
<link rel="stylesheet" href="tokens.css">
<style>
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font:16px/1.55 var(--body);padding-inline:16px;}
.wrap{max-width:1120px;margin-inline:auto}
a{color:inherit}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.1}
h2{font-size:clamp(28px,4vw,40px);font-weight:700}
h3{font-size:21px;font-weight:700}
p{margin:0}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
section{padding-block:56px;border-top:1px solid var(--line)}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:999px;padding:14px 22px;font-weight:600;text-decoration:none;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn:hover{filter:brightness(1.05)}

/* header */
header.top{display:flex;align-items:center;justify-content:space-between;padding-block:18px;gap:16px}
.logo{font-family:var(--display);font-weight:800;font-size:24px;display:flex;align-items:baseline;gap:8px}
.logo small{font-family:var(--hand);font-weight:500;font-size:20px;color:var(--accent)}
nav.links{display:flex;gap:20px;font-size:15px;color:var(--muted)}
nav.links a{text-decoration:none}
@media (max-width:760px){nav.links{display:none}}

/* hero */
.hero{display:grid;grid-template-columns:1.05fr 1fr;gap:48px;align-items:center;padding-block:32px 64px}
@media (max-width:900px){.hero{grid-template-columns:1fr;gap:36px}}
.hero h1{font-size:clamp(38px,6vw,64px);font-weight:800;letter-spacing:-.01em}
.hero h1 em{font-style:italic;font-weight:500;color:var(--accent)}
.hero .lead{font-size:19px;color:var(--muted);margin-top:18px;max-width:34em}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:24px}
.chip{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.cta-row{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px;align-items:center}
.hint{font-size:14px;color:var(--muted)}

/* book mock */
.book{position:relative;display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border-radius:6px;box-shadow:var(--shadow);padding:18px;gap:18px;aspect-ratio:1.55/1;max-width:100%}
.book::after{content:"";position:absolute;left:50%;top:10px;bottom:10px;width:1px;background:linear-gradient(var(--line),transparent 20%,transparent 80%,var(--line))}
.page{display:grid;gap:8px;grid-template-rows:1fr auto;min-width:0}
.ph{border-radius:3px;position:relative;overflow:hidden}
.ph::before{content:"";position:absolute;inset:auto 18% 0 18%;height:58%;border-radius:50% 50% 0 0;background:rgba(255,255,255,.28)}
.ph::after{content:"";position:absolute;left:50%;top:22%;width:22%;aspect-ratio:1;border-radius:50%;transform:translateX(-50%);background:rgba(255,255,255,.34)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cap{font-family:var(--hand);font-size:clamp(15px,1.8vw,20px);line-height:1.1;color:var(--ink)}
.cap b{font-weight:700;color:var(--accent)}
.sticky{position:absolute;right:-8px;top:-26px;background:var(--note);color:var(--note-ink);font-family:var(--hand);font-size:20px;padding:10px 14px;transform:rotate(-3deg);box-shadow:var(--shadow);max-width:210px;line-height:1.1}
.book-meta{display:flex;justify-content:space-between;gap:12px;margin-top:34px;font-size:14px;color:var(--muted);flex-wrap:wrap}
.meter{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:6px;width:180px;max-width:100%}
.meter i{display:block;height:100%;background:var(--accent);width:62%}
.who{display:flex;align-items:center}
.who span{width:28px;height:28px;border-radius:50%;border:2px solid var(--ground);margin-left:-8px;display:grid;place-items:center;font-size:12px;font-weight:600;color:#1B2420}
.who span:first-child{margin-left:0}

/* steps */
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;margin-top:32px;counter-reset:s}
@media (max-width:900px){.steps{grid-template-columns:1fr 1fr}}
@media (max-width:520px){.steps{grid-template-columns:1fr}}
.step{counter-increment:s;display:grid;gap:8px;align-content:start}
.step::before{content:counter(s);font-family:var(--display);font-weight:800;font-size:40px;color:var(--accent);line-height:1}
.step p{color:var(--muted);font-size:15px}

/* together */
.two{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:start}
@media (max-width:900px){.two{grid-template-columns:1fr;gap:28px}}
.feed{background:var(--surface);border-radius:8px;box-shadow:var(--shadow);padding:6px 0}
.feed li{list-style:none;display:grid;grid-template-columns:36px 1fr auto;gap:12px;align-items:center;padding:12px 18px;border-top:1px solid var(--line)}
.feed li:first-child{border-top:0}
.feed ul{margin:0;padding:0}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;color:#1B2420}
.feed .t{font-size:15px}
.feed .t small{display:block;color:var(--muted);font-size:13px}
.tag{font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.tag.ok{background:transparent;color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.bul{display:grid;gap:14px;margin-top:22px;padding:0}
.bul li{list-style:none;padding-left:26px;position:relative}
.bul li::before{content:"";position:absolute;left:0;top:.55em;width:12px;height:2px;background:var(--accent)}

/* quiz */
.quiz{background:var(--surface);border-radius:10px;box-shadow:var(--shadow);padding:28px;margin-top:28px}
@media (max-width:520px){.quiz{padding:20px}}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.dots{display:flex;gap:6px}
.dots i{width:26px;height:4px;border-radius:99px;background:var(--line)}
.dots i.on{background:var(--accent)}
.qtitle{font-family:var(--display);font-size:clamp(24px,3vw,30px);font-weight:700;margin-top:18px}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-top:18px}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--ground);color:var(--ink);border-radius:8px;padding:14px 16px;font-weight:500}
.opt small{display:block;color:var(--muted);font-weight:400;font-size:13px;margin-top:2px}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.qnav{display:flex;justify-content:space-between;gap:12px;margin-top:22px;flex-wrap:wrap;align-items:center}
input[type=date],input[type=text],input[type=tel]{font:inherit;color:var(--ink);background:var(--ground);border:1.5px solid var(--line);border-radius:8px;padding:12px 14px;width:100%;max-width:320px}
.datebox{margin-top:18px;display:grid;gap:10px}

/* results */
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:20px}
@media (max-width:820px){.cards{grid-template-columns:1fr}}
.card{border:1.5px solid var(--line);border-radius:10px;padding:18px;display:grid;gap:10px;align-content:start;background:var(--ground);text-align:left;color:var(--ink)}
.card[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.card .rec{justify-self:start;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--accent);color:var(--accent-ink);padding:3px 8px;border-radius:4px}
.card .price{font-family:var(--display);font-size:30px;font-weight:800;font-variant-numeric:tabular-nums}
.card .per{font-size:13px;color:var(--muted)}
.card ul{margin:0;padding-left:18px;font-size:14px;color:var(--muted)}
.mini{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;height:40px}
.mini i{border-radius:2px}
.optlist{display:grid;gap:10px;margin-top:22px}
.orow{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.orow label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.orow input[type=checkbox]{margin-top:4px;accent-color:var(--accent);width:18px;height:18px}
.orow .sub{display:block;font-size:13px;color:var(--muted)}
.orow .amt{font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:600}
.stepper{display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:99px}
.stepper button{border:0;background:transparent;color:var(--ink);width:34px;height:34px;font-size:18px}
.stepper output{min-width:22px;text-align:center;font-variant-numeric:tabular-nums;font-weight:600}
.total{display:grid;gap:6px;margin-top:10px;padding:18px;border-radius:8px;background:var(--ground);font-variant-numeric:tabular-nums}
.total .line{display:flex;justify-content:space-between;gap:12px;font-size:14px;color:var(--muted)}
.total .sum{display:flex;justify-content:space-between;gap:12px;font-family:var(--display);font-size:26px;font-weight:800;color:var(--ink);margin-top:6px}
.note{font-size:14px;color:var(--muted);margin-top:10px}
.warn{font-size:14px;background:var(--accent-soft);color:var(--ink);padding:10px 14px;border-radius:8px;margin-top:14px}
.free{margin-top:18px;padding-top:16px;border-top:1px dashed var(--line);font-size:15px;color:var(--muted)}
.free a{color:var(--accent);font-weight:600}

/* pricing table */
.tbl{overflow-x:auto;margin-top:26px;background:var(--surface);border-radius:10px;box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;min-width:720px;font-size:15px}
th,td{text-align:left;padding:14px 16px;border-top:1px solid var(--line);vertical-align:top}
thead th{border-top:0;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
td.num{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
tr.hl td{background:var(--accent-soft)}

/* privacy */
.priv{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:28px}
@media (max-width:820px){.priv{grid-template-columns:1fr}}
.priv div{display:grid;gap:8px}
.priv p{color:var(--muted);font-size:15px}

details{border-top:1px solid var(--line);padding-block:16px}
details:last-child{border-bottom:1px solid var(--line)}
summary{font-weight:600;cursor:pointer;font-size:17px}
details p{color:var(--muted);margin-top:10px;max-width:62ch}
footer{padding-block:36px;color:var(--muted);font-size:14px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
.demo{font-size:13px;background:var(--note);color:var(--note-ink);padding:8px 14px;border-radius:6px;text-align:center;margin-top:12px}
@media (prefers-reduced-motion:no-preference){.card,.opt,.chip{transition:border-color .15s,background .15s,box-shadow .15s}}
</style>

.total{display:grid;gap:6px;margin-top:10px;padding:18px;border-radius:8px;background:var(--ground);font-variant-numeric:tabular-nums}
.total .line{display:flex;justify-content:space-between;gap:12px;font-size:14px;color:var(--muted)}
.total .sum{display:flex;justify-content:space-between;gap:12px;font-family:var(--display);font-size:26px;font-weight:800;color:var(--ink);margin-top:6px}
.note{font-size:14px;color:var(--muted);margin-top:10px}
.warn{font-size:14px;background:var(--accent-soft);color:var(--ink);padding:10px 14px;border-radius:8px;margin-top:14px}
.free{margin-top:18px;padding-top:16px;border-top:1px dashed var(--line);font-size:15px;color:var(--muted)}
.free a{color:var(--accent);font-weight:600}

/* pricing table */
.tbl{overflow-x:auto;margin-top:26px;background:var(--surface);border-radius:10px;box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;min-width:720px;font-size:15px}
th,td{text-align:left;padding:14px 16px;border-top:1px solid var(--line);vertical-align:top}
thead th{border-top:0;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
td.num{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
tr.hl td{background:var(--accent-soft)}

/* privacy */
.priv{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:28px}
@media (max-width:820px){.priv{grid-template-columns:1fr}}
.priv div{display:grid;gap:8px}
.priv p{color:var(--muted);font-size:15px}

details{border-top:1px solid var(--line);padding-block:16px}
details:last-child{border-bottom:1px solid var(--line)}
summary{font-weight:600;cursor:pointer;font-size:17px}
details p{color:var(--muted);margin-top:10px;max-width:62ch}
footer{padding-block:36px;color:var(--muted);font-size:14px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
.demo{font-size:13px;background:var(--note);color:var(--note-ink);padding:8px 14px;border-radius:6px;text-align:center;margin-top:12px}
@media (prefers-reduced-motion:no-preference){.card,.opt,.chip{transition:border-color .15s,background .15s,box-shadow .15s}}

/* отдельная страница квиза (ТЗ ред. 7, §2) */
body.quiz-page{background:var(--ground);color:var(--ink);font-family:var(--body);margin:0}
.quiz-page .top{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line);
  background:var(--surface)}
.quiz-page .top .btn{margin-left:auto}
.quiz-page .brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.quiz-page .brand .wm{font-family:var(--display);font-size:19px;font-weight:700;display:flex;align-items:baseline;gap:8px}
.quiz-page .brand .wm em{font-family:var(--hand);font-style:normal;font-size:15px;color:var(--accent)}
.quiz-page .logo{display:flex;gap:3px}
.quiz-page .logo i{width:9px;height:14px;border-radius:2px;background:var(--accent-soft);display:block}
.quiz-page .logo i:last-child{background:var(--accent)}
.quiz-wrap{max-width:720px;margin:0 auto;padding:clamp(18px,4vw,40px) 16px 60px}
.quiz-page .fine{color:var(--muted);font-size:12.5px;margin-top:18px}
</style>

/* ===== квиз ===== */
const TAR={

const Q=[

  {k:"photos",t:"Сколько фото наберётся у всех вместе?",o:[["s","До 60","хватит на 24–40 страниц"],["m","60–150","книга на 44–80 страниц"],["l","150–300","книга на 84–120 страниц"],["xl","Больше 300","одна книга из лучших кадров или две книги"]]},
  {k:"texts",t:"Кто будет писать тексты?",o:[["self","Мы сами"],["ai","Сами, но с подсказками","сервис предложит варианты"],["editor","Хочу, чтобы помог редактор"]]},
  {k:"people",t:"Кто будет собирать книгу?",o:[["1","Только я",""],["5","Я и 2–5 родных"],["12","6–20 человек"],["30","Больше 20","класс, большой отдел"]]}
];
const PEOPLE_N={"1":1,"5":4,"12":12,"30":20};
const SKEY="vm:quiz";

const saved=loadQuiz()||{};
// прошлый заказ не подставляется в новый подбор: он показывается отдельной строкой
const prevOrder=saved.order||null;
// подбор всегда начинается с чистого листа: старые ответы не подставляются (баг-лист §4)
const state={i:0,a:{occ:"mom"},pick:null,copies:0,qr:false,cover:0,box:0,
  urgent:false,credit:false,done:false,lead:null,order:null};
let firstRender=true;
const fmt=n=>n.toLocaleString("ru-RU").replace(/,/g," ")+" ₽";
const PRINT_DAYS=12;                       // срок изготовления и доставки, дней
const MONTHS=["январ","феврал","март","апрел","ма","июн","июл","август","сентябр","октябр","ноябр","декабр"];
/* «4 ноября» или «4.11» + необязательный год → YYYY-MM-DD, год ближайший будущий (§2.1) */
function parseDM(dm,year){
  if(!dm) return "";
  const s=dm.toLowerCase().replace(/ё/g,"е").trim();
  let day=0, mon=-1;
  let m=s.match(/^(\d{1,2})[.\/-](\d{1,2})$/);
  if(m){ day=+m[1]; mon=+m[2]-1; }
  else{
    m=s.match(/^(\d{1,2})\s+([а-я]+)/);
    if(!m) return "";
    day=+m[1];
    mon=MONTHS.findIndex(x=>m[2].startsWith(x));
  }
  if(!(day>=1&&day<=31)||mon<0||mon>11) return "";
  const now=new Date();
  let y=year&&/^\d{4}$/.test(year)?+year:now.getUTCFullYear();
  if(!year){
    const cand=new Date(Date.UTC(y,mon,day,12));
    if(cand.getTime()<now.getTime()) y+=1;   // год подставляем ближайший будущий
  }
  const d=new Date(Date.UTC(y,mon,day,12));
  if(isNaN(d)) return "";
  return d.toISOString().slice(0,10);
}
function daysLeft(){if(!state.a.date)return null;const d=new Date(state.a.date+"T12:00:00");return Math.round((d-new Date())/864e5);}
function recommend(){

  const r={s:"moment",m:"glava",l:"zhizn",xl:"zhizn"}[a.photos]||"moment";
  return {rec:r,list:["moment","glava","zhizn"]};
}
function calc(){
  const t=TAR[state.pick];const base=t.p;const copy=Math.round(base*0.8);
  const copies=copy*state.copies;const ex=1+state.copies;
  const urgent=state.urgent?Math.round((base+copies)*0.3):0;
  const qr=state.qr?600:0,cover=990*Math.min(state.cover,ex),box=490*Math.min(state.box,ex);
  const credit=state.credit&&t.credit?990:0;
  return {base,copy,copies,urgent,qr,cover,box,credit,ex,total:base+copies+urgent+qr+cover+box-credit};
}

  if(state.a.people==="30") h+='<p class="warn">В проекте до 20 участников. Для класса или большого отдела позовите 20 самых активных: остальные смогут посмотреть книгу по ссылке и заказать свой экземпляр.</p>';
  const c=calc();

  if(c.cover)h+='<div class="line"><span>Премиум-обложки</span><span>'+fmt(c.cover)+'</span></div>';
  if(c.box)h+='<div class="line"><span>Подарочные коробки</span><span>'+fmt(c.box)+'</span></div>';
  if(c.qr)h+='<div class="line"><span>QR-код на видео</span><span>'+fmt(c.qr)+'</span></div>';
  if(c.credit)h+='<div class="line"><span>Учтён оплаченный Альбом</span><span>−'+fmt(c.credit)+'</span></div>';
  h+='<div class="sum"><span>Итого</span><span>'+fmt(c.total)+'</span></div>';
  if(ppl>1)h+='<div class="line"><span>Если скинуться на '+ppl+'</span><span>≈ '+fmt(Math.ceil(c.total/ppl/10)*10)+' с человека</span></div>';
  h+='</div><p class="note">Доставка рассчитывается отдельно.</p>';
  h+='<div class="qnav"><span></span><button class="btn" id="pay">Оплатить '+fmt(c.total)+'</button></div>';
  h+='<p class="free">Не готовы платить сейчас? <a href="app.html?free=1">Соберите альбом бесплатно в браузере</a>. Позвать родных и напечатать можно позже.</p>';
  box.innerHTML=h;
  box.querySelectorAll(".card").forEach(b=>b.onclick=()=>{state.pick=b.dataset.k;render(true);});
  $("#again").onclick=()=>{state.i=0;render();};
  $("#cm").onclick=()=>{state.copies=Math.max(0,state.copies-1);syncEx();render(true);};
  $("#cp").onclick=()=>{state.copies=Math.min(20,state.copies+1);syncEx();render(true);};
  $("#oqr").onchange=e=>{state.qr=e.target.checked;render(true);};
  $("#ocov").onchange=e=>{state.cover=e.target.checked?99:0;render(true);};
  $("#obox").onchange=e=>{state.box=e.target.checked?99:0;render(true);};
  $("#ourg").onchange=e=>{state.urgent=e.target.checked;state.urgentAuto=false;render(true);};
  const cr=$("#ocr");if(cr)cr.onchange=e=>{state.credit=e.target.checked;render(true);};
  $("#pay").onclick=()=>{state.done=true;render();};
}
function syncEx(){}
function makeOrder(){
  const c=calc(), t=TAR[state.pick];
  const id="o"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  const tok=(Math.random().toString(36)+Math.random().toString(36)).replace(/0\./g,"").slice(0,12);
  const occMap={mom:"jubilee",wedding:"wedding",work:"other",grad:"family",other:"other"};
  const o={
    id:id, createdAt:Date.now(), status:"paid",           // в MVP оплата — заглушка
    title:{mom:"Книга к юбилею",wedding:"Книга к годовщине",work:"Книга от коллег",grad:"Книга класса"}[state.a.occ]||"Книга историй",
    occasion:occMap[state.a.occ]||"other",
    occKey:state.a.occ,
    date:state.a.date||"", deliv:state.a.deliv||"later",
    photos:state.a.photos||"", texts:state.a.texts||"", people:PEOPLE_N[state.a.people]||1,
    tier:t.n, tierPrice:t.p,
    options:{copies:state.copies, qr:state.qr, cover:!!state.cover, box:!!state.box, urgent:state.urgent, credit:state.credit},
    totals:{base:c.base, copies:c.copies, urgent:c.urgent, qr:c.qr, cover:c.cover, box:c.box, credit:c.credit, total:c.total},
    owner:state.lead?{name:state.lead.n,contact:state.lead.c}:null,
    invites:[], inviteToken:tok,
    access:{collect:true, invite:true, public:false},
    stage:"collect", edition:1, extraDays:0, log:[{t:Date.now(),who:"владелец",act:"заказ создан",info:t.n}]
  };
  try{ localStorage.setItem("vm:order:"+id, JSON.stringify(o)); }catch(_){}
  try{ const m=JSON.parse(localStorage.getItem("vm:tokens")||"{}")||{};
       m[tok]={order:id,invite:null};
       localStorage.setItem("vm:tokens",JSON.stringify(m)); }catch(_){}
  return o;
}
function renderDone(box){
  const c=calc();
  if(!state.lead){
    box.innerHTML='<p class="eyebrow">Почти готово</p><p class="qtitle">Куда прислать ссылку на проект?</p><form id="lf" class="datebox"><label for="lname" class="hint">Как вас зовут</label><input type="text" id="lname" name="lname" required autocomplete="name" aria-required="true"><label for="lcontact" class="hint">Телефон или почта</label><input type="text" id="lcontact" name="lcontact" required autocomplete="tel" aria-required="true"><div class="qnav"><button type="button" class="btn ghost" id="lback">Назад</button><button class="btn" type="submit">Перейти к оплате</button></div></form>';
    $("#lback").onclick=()=>{state.done=false;render();};
    $("#lf").addEventListener("submit",e=>{e.preventDefault();
      state.lead={n:$("#lname").value.trim(),c:$("#lcontact").value.trim()};
      state.order=makeOrder(); saveQuiz(); render();});
    return;
  }
  if(!state.order) state.order=makeOrder();
  const o=state.order, link="app.html?order="+o.id, ilink="app.html?i="+o.inviteToken;
  box.innerHTML='<p class="eyebrow">Заявка принята</p><p class="qtitle">'+state.lead.n+', проект создан</p>'+
    '<p class="note">Книга «'+TAR[state.pick].n+'», '+c.ex+' экз., итого '+fmt(c.total)+
    '. В демо оплата не списывается: мы фиксируем состав заказа, сумму и контакт, как в MVP.</p>'+
    '<div class="warn"><b>Следующий шаг:</b> позовите родных — имя и телефон каждого, — и отправьте приглашение в семейный чат. '+
      'Можно и пропустить: соберёте книгу сами. <a class="btn" href="'+link+'&invite=1" '+
      'style="margin-top:10px;padding:8px 14px;font-size:14px">Позвать родных</a></div>'+
    '<div class="qnav"><button class="btn ghost" id="restart">Подобрать заново</button>'+
    '<a class="btn" href="'+link+'">Открыть редактор</a></div>'+
    '<p class="free">Ссылка проекта — только ваша: <code>'+link+'</code>. Родным уходит другая, '+
      'по ней они добавляют материалы, но не могут менять заказ и печать: <code>'+ilink+'</code>.</p>';
  $("#restart").onclick=()=>{
    Object.assign(state,{i:0,a:{occ:"mom"},pick:null,copies:0,qr:false,cover:0,box:0,
      urgent:false,credit:false,done:false,lead:null,order:null,urgentAuto:undefined});
    try{ localStorage.removeItem(SKEY); }catch(_){}
    saveQuiz(); render();
  };
}
render();
})();
</script>
</body></html>
